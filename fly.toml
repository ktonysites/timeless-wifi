# Fly.io — run:  fly launch --copy-config --no-deploy   then   fly deploy
app = "timeless-wifi"            # change to a unique name
primary_region = "jnb"           # Johannesburg, the closest Fly region to Kenya

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # keep it running so M-Pesa callbacks are never missed
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
